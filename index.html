<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Radar Bot</title>
    <meta name="description" content="Avisador personal de radares, helicópteros Pegasus de la DGT e incidencias de tráfico en España." />
    <meta name="theme-color" content="#eef1f5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Radar Bot" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Tema antes de pintar para evitar parpadeo.
      try {
        var s = JSON.parse(localStorage.getItem('radar-bot:settings') || '{}');
        var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Esta aplicación necesita JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
